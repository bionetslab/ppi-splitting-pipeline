name: ppi-splitting-pipeline
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- certifi *
- blast >=2.16
- kahip >=3.28
- multiqc >=1.35
- scikit-learn >=1.9
- matplotlib >=3.11
- plotly >=7.2
- python >=3.14,<3.15
- numpy >=2.5
- scipy >=1.18
- cd-hit >=4.8.1
- pyscipopt >=6.2.1
- scip 10.0.*
- pip
