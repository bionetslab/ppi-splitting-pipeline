name: ppi-splitting-pipeline-split-only
channels:
  - conda-forge
  - bioconda
# Only for docker/Dockerfile.split_only. Exact pins: two builds must not resolve different
# solver versions (ILP results).
dependencies:
  - python=3.14.7
  - numpy=2.5.2
  - scipy=1.18.0
  - pyscipopt=6.2.1  # SCIP fallback when Gurobi is unavailable
  - cd-hit=4.8.1
  - pip:
    # cvxpy and every transitive dependency pinned, so pip resolves nothing at build time.
    - cvxpy==1.9.2
    - osqp==1.1.3
    - clarabel==0.11.1
    - scs==3.2.11
    - qdldl==0.1.9.post1
    - sparsediffpy==0.3.0
    - highspy==1.15.1
    - gurobipy==13.0.3
