name: Run pipeline tests

on:
  pull_request:
    branches: [main, dev]
    # Skipped only if every changed file matches. environment.yml is exported from pixi.toml (checked in the full job).
    paths-ignore:
      - "manuscript_figures/**"
      - "prep_datasets/**"
      - "samplesheets/**"
      - "docker/**"
      - "**.md"
      - "**.png"
      - "**.svg"
      - "LICENSE"
      - "source_metromap"
      - ".gitignore"
      - ".dockerignore"
      - "environment.yml"
      - ".github/workflows/publish-docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pipeline

      # The conda profile reads environment.yml; it must match pixi.toml.
      - name: Check environment.yml is up to date
        run: |
          pixi workspace export conda-environment -p linux-64 -n ppi-splitting-pipeline /tmp/environment.yml
          diff environment.yml /tmp/environment.yml || { echo "Run: pixi workspace export conda-environment -p linux-64 -n ppi-splitting-pipeline environment.yml"; exit 1; }

      - name: Run test profile
        run: pixi run -e test nextflow run main.nf -profile test -ansi-log false

      # Inputs for the mode jobs below (their samplesheets point into results/results_test).
      - uses: actions/upload-artifact@v5
        with:
          name: results-test
          path: results/results_test

      - name: Upload Nextflow log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nextflow-log-full
          path: .nextflow.log

  # Independent of full, so it runs alongside full -> modes. One row keeps it to 27 seed combinations.
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pipeline

      - name: Run --robustness_test
        run: >-
          pixi run -e test nextflow run main.nf -profile test -ansi-log false
          --robustness_test
          --samplesheet assets/samplesheet_test_robustness.csv
          --outdir results/results_test_robustness

      - name: Upload Nextflow log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nextflow-log-robustness
          path: .nextflow.log

  modes:
    needs: full
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [split_only, bias_only, precomputed_split]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pipeline

      - uses: actions/download-artifact@v5
        with:
          name: results-test
          path: results/results_test

      - name: Run --${{ matrix.mode }}
        run: >-
          pixi run -e test nextflow run main.nf -profile test -ansi-log false
          --${{ matrix.mode }}
          --samplesheet assets/samplesheet_test_${{ matrix.mode }}.csv
          --outdir results/results_test_${{ matrix.mode }}

      - name: Upload Nextflow log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nextflow-log-${{ matrix.mode }}
          path: .nextflow.log
