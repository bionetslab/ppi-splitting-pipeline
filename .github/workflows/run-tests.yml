name: Run pipeline tests

on:
  pull_request:
    branches: [main, dev]
    # Skipped only if every changed file matches; CI runs on environment_test.yml, not these env files/images.
    paths-ignore:
      - "manuscript_figures/**"
      - "prep_datasets/**"
      - "samplesheets/**"
      - "docker/**"
      - "**.md"
      - "**.png"
      - "**.svg"
      - "LICENSE"
      - "source_metromap"
      - ".gitignore"
      - ".dockerignore"
      - "environment.yml"
      - "environment_split_only.yml"
      - ".github/workflows/publish-docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # login shell, so conda is on PATH
    env:
      NXF_CONDA_CACHEDIR: ${{ github.workspace }}/../nf-conda  # outside the checkout, stable across runs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.10.5"

      # Only provides the conda binary; Nextflow builds the env from environment_test.yml.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      # Nextflow names the env by the file's hash and reuses an existing one.
      - uses: actions/cache@v4
        with:
          path: ${{ env.NXF_CONDA_CACHEDIR }}
          key: nf-conda-${{ runner.os }}-${{ hashFiles('environment_test.yml') }}

      - name: Run test profile
        run: nextflow run main.nf -profile test -with-conda environment_test.yml -ansi-log false

      - name: Upload Nextflow log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nextflow-log
          path: .nextflow.log
