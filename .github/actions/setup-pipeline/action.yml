name: Set up pipeline test environment
description: Java, Nextflow, and pixi's cached test environment (from pixi.lock).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - uses: nf-core/setup-nextflow@v2
      with:
        version: "26.10.5"

    # locked: fails if pixi.lock is out of date with pixi.toml.
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.67.1
        environments: test
        locked: true
        cache: true
