name: ppi-splitting-pipeline-test
channels:
  - conda-forge
  - bioconda
  - defaults
# CI only: environment.yml without the embedding packages (torch, transformers, sentencepiece, protobuf),
# which embedding_model=none never imports. Keep the other pins in sync with environment.yml.
dependencies:
  - python=3.14.7
  - certifi=2026.11.20
  - blast=2.17.0
  - cd-hit=4.8.1
  - kahip=3.28
  - multiqc=1.35
  - scikit-learn=1.9.1
  - numpy=2.5.4
  - matplotlib=3.11.2
  - plotly=7.2.0
  - pyscipopt=6.2.1
  - scip=10.0.2  # pyscipopt 6.2.1 links libscip.so.10.0 but allows scip 10.1 (no libscip.so.10.0)
  - pip:
    - cvxpy[GUROBI]==1.9.3
    - gurobipy==14.0.0  # what cvxpy's [GUROBI] extra installs, pinned
    - highspy==1.16.0   # OSS MIP fallback for sample_negatives_ilp.py when Gurobi is unavailable
    - pyyaml==6.0.4     # --config YAML for sample_negatives_ilp.py --batch
